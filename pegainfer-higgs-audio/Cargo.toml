[package]
name = "pegainfer-higgs-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
half = { workspace = true }
memmap2 = { workspace = true }
pegainfer-core = { workspace = true, optional = true }
pegainfer-frontend = { workspace = true, optional = true }
pegainfer-kernels = { workspace = true, optional = true }
pegainfer-qwen3 = { workspace = true, optional = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[features]
reference-python-codec = []
server-line = ["dep:pegainfer-frontend"]
runtime-qwen3 = ["dep:pegainfer-core", "dep:pegainfer-kernels", "dep:pegainfer-qwen3", "pegainfer-kernels/higgs-audio"]

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "higgs_dump_one_step_actual"
path = "src/bin/higgs_dump_one_step_actual.rs"
required-features = ["runtime-qwen3"]

[[bin]]
name = "higgs_prefill_prompt_session_smoke"
path = "src/bin/higgs_prefill_prompt_session_smoke.rs"
required-features = ["runtime-qwen3"]

[[bin]]
name = "higgs_dump_prefill_layer_hidden"
path = "src/bin/higgs_dump_prefill_layer_hidden.rs"
required-features = ["runtime-qwen3"]

[[bin]]
name = "higgs_dump_layer0_stages"
path = "src/bin/higgs_dump_layer0_stages.rs"
required-features = ["runtime-qwen3"]

[[bin]]
name = "higgs_prepare_codegen_artifacts"
path = "src/bin/higgs_prepare_codegen_artifacts.rs"

[[bin]]
name = "higgs_replay_hidden_codegen"
path = "src/bin/higgs_replay_hidden_codegen.rs"

[[bin]]
name = "higgs_native_continuation_smoke"
path = "src/bin/higgs_native_continuation_smoke.rs"
required-features = ["runtime-qwen3"]

[[bin]]
name = "higgs_native_forced_prefix_smoke"
path = "src/bin/higgs_native_forced_prefix_smoke.rs"
required-features = ["runtime-qwen3"]

[[bin]]
name = "higgs_compare_codegen_trace"
path = "src/bin/higgs_compare_codegen_trace.rs"

[[bin]]
name = "higgs_vocode_codes"
path = "src/bin/higgs_vocode_codes.rs"
required-features = ["reference-python-codec"]

[[bin]]
name = "higgs_native_e2e_smoke"
path = "src/bin/higgs_native_e2e_smoke.rs"
required-features = ["runtime-qwen3"]

[lints]
workspace = true
